  <text x="870" y="116" fill="#98194F" font-family="monospace" font-size="20" letter-spacing="2">EVIDENCE FUNNEL</text>
  <text x="870" y="183" fill="#1A1C16" font-family="Arial, sans-serif" font-size="52" font-weight="700">5,012,204</text>
  <text x="870" y="212" fill="#585C4E" font-family="monospace" font-size="16">GENOMIC VARIANTS</text>
  <path d="M875 235H1120L1065 325H930Z" fill="#B5822A" fill-opacity=".23" stroke="#B5822A"/>
