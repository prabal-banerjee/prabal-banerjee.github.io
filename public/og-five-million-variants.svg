<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Five million variants. One hypothesis. An evidence funnel narrows a rare-disease genome to a testable question.">
  <rect width="1200" height="630" fill="#E9EAE4"/>
  <rect x="828" width="372" height="630" fill="#DFE1D8"/>
  <path d="M830 0V630" stroke="#1A1C16" stroke-opacity=".14"/>
  <text x="65" y="148" fill="#1A1C16" font-family="Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">Five million</text>
  <text x="65" y="236" fill="#1A1C16" font-family="Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">variants.</text>
  <text x="65" y="324" fill="#98194F" font-family="Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">One hypothesis.</text>
  <text x="67" y="398" fill="#585C4E" font-family="monospace" font-size="21">How AI and open science make a rare-disease</text>
  <text x="67" y="429" fill="#585C4E" font-family="monospace" font-size="21">genome an investigable question.</text>
  <path d="M65 553H1135" stroke="#1A1C16" stroke-opacity=".24"/>
